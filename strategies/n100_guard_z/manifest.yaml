      format: "percent"
  rules:
    - title: "信号层：月频出场（DualMom-B FastRe）"
      description: "每月最后一个交易日：QQQ ≤ SMA225 → 转入现金。二元口径：SPY_INVESTED 映射为 CASH。"
    - title: "信号层：周频回场"
      description: "仅在 TRUE_CASH_STRETCH 中，每周五检查：QQQ > SMA225 且 SPY 12m > 0 且 QQQ 12m > SPY 12m → 次交易日回场。"
    - title: "执行层：Hybrid Z-Score 溢价轮动"
      description: "risk_on 期间从12只纳指100 ETF中选最优标的。切换需同时满足：z-score差 > 1.0、绝对溢价差 > 16bps、持有 ≥ 10天。"
    - title: "执行时序"
      description: "T日US收盘信号 → T+1日A股开盘执行。空仓期按货币基金年化2%计算收益。"
  data_source_desc: "US数据：QQQ/SPY日线（yfinance）。A股数据：12只纳指100 ETF日线 + NAV。信号T日US收盘生成，T+1日A股开盘执行。"

