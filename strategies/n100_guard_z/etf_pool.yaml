# N100 Guard-Z ETF Pool Configuration
# Single source of truth for Nasdaq-100 tracking ETFs listed on A-share markets
#
# Maintenance protocol:
#   1. Auto-discovery: scan full market ETF list via AKShare/Eastmoney API
#   2. Candidate filter: official_short_name contains "纳指" OR "纳斯达克100"
#   3. Manual validation: verify tracking_index == "纳斯达克100指数" via fund archive
#   4. NAV/OHLC availability check: ensure data retrievable via AKShare
#   5. PR approval: new additions require backtest rerun (universe change affects metrics)
#
# Field definitions:
#   - code: 6-digit ETF security code
#   - official_short_name: 证券简称 from exchange (display on site)
#   - full_name: 基金全称 from fund archive
#   - manager: 基金管理人
#   - tracking_index: 跟踪标的指数 (must be "纳斯达克100指数")
#   - listed_date: 本地可交易数据首日 (YYYY-MM-DD, from local OHLCV files)
#   - exchange: SH (上海) / SZ (深圳)
#   - source_url: fund archive URL for verification
#   - checked_at: last manual verification timestamp (YYYY-MM-DD)
#   - enabled_from: date when this ETF was added to the pool (YYYY-MM-DD)
#   - note: optional remarks

