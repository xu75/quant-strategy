# strategies/btc_ma_trend/manifest.yaml
id: btc_ma_trend
name: "TrendLock 40"
version: "1.0.0"
description: "BTC 4H MA240 趋势跟踪，最小持仓 4 天"

config:
  ma_window: 240
  min_hold_bars: 24
  timeframe: "4H"
  symbol: "BTC-USDT"
  data_source: "okx"

data_sources:
  btc:
    symbol: "BTC-USDT"
    timeframe: "4H"
    source: "local"
    local_file: "BTC-USD_1h.csv"

display:
  slug: "btc-ma240-4d"
  category: "trend-following"
  short_desc: "BTC 均线趋势跟踪"

min_lookback_years: 5
warmup_bars: 240

launch_date: "2026-04-30"
enabled: true

research:
  paper_title: "BTC_4H_MA趋势策略研究论文"
  website_path: "/research/btc-ma240-4d"
  canonical_doc: "docs/research/strategies/btc_ma_trend.md"
  source_docx: "docs/research/sources/btc_ma_trend_source_2026-05.docx"

page:
  subtitle: "{symbol} · {timeframe} · MA{ma_window} · Min hold {min_hold_days}D"
  card_subtitle: "{symbol} · {timeframe} · MA{ma_window}"
  card_fields:
    - label: "MA{ma_window}"
      key: "ma_value"
      format: "currency"
    - label: "Hold Bars"
      key: "hold_bars"
      format: "plain"
  signal_fields:
    - label: "Price"
      key: "price"
      format: "currency"
    - label: "MA{ma_window}"
      key: "ma_value"
      format: "currency"
    - label: "Hold Bars"
      key: "hold_bars"
      format: "plain"
    - label: "Signal Time"
      key: "timestamp"
      format: "datetime"
  rules:
    - title: "Entry (Buy)"
      description: "Crossover confirmation: previous close ≤ previous MA240, current close > MA240."
    - title: "Exit (Sell)"
      description: "Close < MA240 after minimum hold of 4 days (24 bars on 4H timeframe)."
    - title: "Design"
      description: "Asymmetric entry/exit: entry requires crossover confirmation to reduce whipsaws, exit only requires price below MA. Minimum hold period prevents premature exits during consolidation."
  data_source_desc: "All data is fetched from OKX public API (no authentication required). Only confirmed/closed candles are used. Signals are generated automatically every 4 hours via GitHub Actions."
