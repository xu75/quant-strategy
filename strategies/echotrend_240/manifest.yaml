# strategies/echotrend_240/manifest.yaml
id: echotrend_240
name: "EchoTrend 240"
version: "2.0.0"
description: "BTC 4H SMA240 regime gate + V6 多因子仓位管理 (v9 trend_regime)"

config:
  ma_window: 240
  bear_confirm_bars: 3
  bull_confirm_bars: 3
  bear_ceiling: 0.0
  bull_ceiling: 1.00
  hysteresis_pct: 0.0
  freeze_bars: 0
  commission_rate: 0.0002
  slippage_rate: 0.0003
  timeframe: "1H"
  exec_timeframe: "1H"
  regime_timeframe: "4H"
  symbol: "MSTR"
  regime_symbol: "BTC-USDT"
  data_source: "local"
  regular_hours_only: true

data_sources:
  mstr:
    symbol: "MSTR"
    timeframe: "1H"
    source: "local"
    local_file: "MSTR_1h.csv"
  btc:
    symbol: "BTC-USDT"
    timeframe: "1H"
    source: "local"
    local_file: "BTC-USD_1h.csv"
  qqq:
    symbol: "QQQ"
    timeframe: "1H"
    source: "local"
    local_file: "QQQ_1h.csv"
  mstr_daily:
    symbol: "MSTR"
    timeframe: "1D"
    source: "local"
    local_file: "MSTR_1d.csv"
  btc_daily:
    symbol: "BTC-USD"
    timeframe: "1D"
    source: "local"
    local_file: "BTC-USD_1d.csv"
  qqq_daily:
    symbol: "QQQ"
    timeframe: "1D"
    source: "local"
    local_file: "QQQ_1d.csv"

display:
  slug: "echotrend-240"
  category: "trend-following"
  short_desc: "MSTR 趋势跟踪（BTC 4H SMA240 regime gate + V6 仓位管理）"

min_lookback_years: 5
warmup_bars: 960

launch_date: "2026-05-04"
enabled: false
status: retracted
status_reason: "V6 多因子归因不成立——策略实际逻辑为纯 BTC SMA240 趋势跟踪，与 V6 仓位管理无关"
status_date: "2026-05-07"
superseded_by: "/strategy/echotrend-240-v2"

research:
  paper_title: "EchoTrend 240: BTC 4H SMA240 Regime Gate + V6 Position Management"
  website_path: "/research/echotrend-240"
  canonical_doc: "docs/research/strategies/echotrend_240.md"
  source_project: "https://github.com/xu75/mstr-strategy-clowder"

page:
  subtitle: "{symbol} · {timeframe} Execution · BTC 4H Regime Gate + V6 Scoring"
  signal_fields:
    - label: "MSTR Price"
      key: "price"
      format: "currency"
    - label: "Exposure"
      key: "target_exposure"
      format: "percent"
    - label: "Mode"
      key: "mode"
      format: "mode"
    - label: "BTC Regime"
      key: "regime"
      format: "regime"
    - label: "Signal Time"
      key: "timestamp"
      format: "datetime"
  rules:
    - title: "Regime Gate (BTC 4H SMA240)"
      description: "BTC 1H data resampled to 4H, SMA240 computed. Bull regime when close > SMA240 for 3 consecutive bars. Bear regime when close < SMA240 for 3 consecutive bars. Signal shifted by 1 bar to avoid lookahead. Regime sets exposure ceiling: bull=1.00, bear=0.00."
    - title: "V6 Exposure Scoring"
      description: "Three-dimensional scoring (trend + risk + relative strength) produces a continuous exposure target between 0.70 and 1.00. EMA smoothing and cooldown prevent overtrading."
    - title: "Execution"
      description: "Symmetric rebalancing: when target exposure diverges from current by more than 3.5%, a market order is placed at next regular-hours bar open. Regime flip to bear forces exposure to 0."
    - title: "Design"
      description: "Two-layer architecture: BTC regime gate (primary alpha) sets directional ceiling, V6 multi-factor scoring (trend/risk/RS) fine-tunes position size within that ceiling. Four modes (bull/neutral/risk_off/crash) apply floor/ceiling constraints. Continuous exposure management, not binary in/out."
  data_source_desc: "Market data from canonical repository (data/market/): BTC-USD and MSTR 1H/1D bars, QQQ 1H/1D/5M bars. CI pipeline updates data via Yahoo Finance (equities) and OKX (crypto) every 4 hours. Signals generated from dual-feed pipeline (BTC 1H → 4H regime + MSTR 1H execution)."
