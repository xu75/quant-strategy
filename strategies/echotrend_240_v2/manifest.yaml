# strategies/echotrend_240_v2/manifest.yaml
id: echotrend_240_v2
name: "EchoTrend 240 V2"
version: "1.0.0"
description: "BTC 4H SMA240 regime gate — MSTR 趋势跟踪（CAP1.0，无杠杆）"

config:
  ma_window: 240
  bear_confirm_bars: 3
  bull_confirm_bars: 3
  bear_ceiling: 0.0
  bull_ceiling: 1.0
  hysteresis_pct: 0.0
  freeze_bars: 0
  commission_rate: 0.0005
  slippage_rate: 0.0005
  timeframe: "1H"
  exec_timeframe: "1H"
  regime_timeframe: "4H"
  symbol: "MSTR"
  regime_symbol: "BTC-USDT"
  data_source: "local"
  regular_hours_only: true

data_sources:
  mstr:
    symbol: "MSTR"
    timeframe: "1H"
    source: "local"
    local_file: "MSTR_1h.csv"
  btc:
    symbol: "BTC-USDT"
    timeframe: "1H"
    source: "local"
    local_file: "BTC-USD_1h.csv"
  qqq:
    symbol: "QQQ"
    timeframe: "1H"
    source: "local"
    local_file: "QQQ_1h.csv"
  mstr_daily:
    symbol: "MSTR"
    timeframe: "1D"
    source: "local"
    local_file: "MSTR_1d.csv"
  btc_daily:
    symbol: "BTC-USD"
    timeframe: "1D"
    source: "local"
    local_file: "BTC-USD_1d.csv"
  qqq_daily:
    symbol: "QQQ"
    timeframe: "1D"
    source: "local"
    local_file: "QQQ_1d.csv"

display:
  slug: "echotrend-240-v2"
  category: "trend-following"
  short_desc: "MSTR 趋势跟踪（BTC 4H SMA240 regime gate，CAP1.0 无杠杆）"

min_lookback_years: 5
warmup_bars: 960

launch_date: "2026-05-07"
enabled: true
status: active

research:
  paper_title: "EchoTrend 240 V2: BTC 4H SMA240 Regime Gate (CAP1.0)"
  website_path: "/research/echotrend-240-v2"
  canonical_doc: "docs/research/strategies/echotrend_240_v2.md"
  source_project: "https://github.com/xu75/mstr-strategy-clowder"

page:
  subtitle: "{symbol} · {timeframe} Execution · BTC 4H Regime Gate (CAP1.0)"
  signal_fields:
    - label: "MSTR Price"
      key: "price"
      format: "currency"
    - label: "BTC Regime"
      key: "regime"
      format: "regime"
    - label: "Mode"
      key: "mode"
      format: "mode"
    - label: "Signal Time"
      key: "timestamp"
      format: "datetime"
  rules:
    - title: "Regime Gate (Core Alpha — BTC 4H SMA240)"
      description: "BTC 1H data resampled to 4H, SMA240 computed. Bull regime when close > SMA240 for 3 consecutive bars. Bear regime when close < SMA240 for 3 consecutive bars. Signal shifted by 1 bar to avoid lookahead. Bull = 100% MSTR, Bear = 0%."
    - title: "V6 Execution Package (Rhythm Optimization)"
      description: "Cooldown (39 bars), EMA smoothing (alpha 0.30), step constraints, and fast reentry logic. Optimizes trade timing within regime-determined direction. Does not alter position size — CAP1.0 means 100% or 0% only."
    - title: "Position Management (CAP1.0)"
      description: "Binary position: 100% MSTR in bull regime, 0% in bear regime. No leverage, no partial positions. Symmetric rebalancing at next regular-hours bar open when regime flips."
    - title: "Design Philosophy"
      description: "Two-layer architecture: BTC regime gate (primary alpha) determines direction, V6 execution package (marginal enhancement) optimizes entry/exit rhythm. Alpha attribution: regime gate alone passes 4-window validation; V6 adds execution quality without altering core returns."
  data_source_desc: "Market data from canonical repository (data/market/): BTC-USD and MSTR 1H/1D bars, QQQ 1H/1D bars. CI pipeline updates data via Yahoo Finance (equities) and OKX (crypto) every 4 hours. Signals generated from dual-feed pipeline (BTC 1H → 4H regime + MSTR 1H execution)."
