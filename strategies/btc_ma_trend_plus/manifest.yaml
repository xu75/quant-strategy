# strategies/btc_ma_trend_plus/manifest.yaml
id: btc_ma_trend_plus
name: "TrendLock 40 Plus"
version: "1.0.0"
description: "BTC 4H MA240 趋势跟踪，exit_confirm=2 + min_hold 2D"

config:
  ma_window: 240
  min_hold_bars: 12
  exit_confirm_bars: 2
  timeframe: "4H"
  symbol: "BTC-USDT"
  data_source: "okx"
  # MA240 开多斜率门 (effective 2026-07). Gates only NEW long entries.
  slope_gate_enabled: true
  slope_lookback_bars: 30
  slope_gate_threshold: -0.02
  slope_gate_effective_date: "2026-07-01"

data_sources:
  btc:
    symbol: "BTC-USDT"
    timeframe: "4H"
    source: "local"
    local_file: "BTC-USD_1h.csv"

min_lookback_years: 5
warmup_bars: 240

display:
  slug: "btc-ma240-ecb2"
  category: "trend-following"
  short_desc: "BTC 均线趋势跟踪（出场确认优化版）"

launch_date: "2026-05-04"
enabled: true

research:
  paper_title: "TrendLock 40 Plus 出场确认优化研究"
  website_path: "/research/btc-ma240-ecb2"
  canonical_doc: "docs/research/strategies/btc_ma_trend_plus.md"

page:
  subtitle: "{symbol} · {timeframe} · MA{ma_window} · Exit Confirm {exit_confirm_bars} · Min hold {min_hold_days}D"
  card_subtitle: "{symbol} · {timeframe} · MA{ma_window}"
  card_fields:
    - label: "MA{ma_window}"
      key: "ma_value"
      format: "currency"
    - label: "Hold Bars"
      key: "hold_bars"
      format: "plain"
  signal_fields:
    - label: "Price"
      key: "price"
      format: "currency"
    - label: "MA{ma_window}"
      key: "ma_value"
      format: "currency"
    - label: "Hold Bars"
      key: "hold_bars"
      format: "plain"
    - label: "Signal Time"
      key: "timestamp"
      format: "datetime"
  rules:
    - title: "Entry (Buy)"
      description: "Crossover confirmation: previous close ≤ previous MA240, current close > MA240."
    - title: "Entry Filter (Slope Gate, since 2026-07)"
      description: "At the golden-cross bar, compute MA240 slope over the prior 30 bars (5 days): slope = MA240(now) / MA240(30 bars ago) − 1. If slope < −2%, skip this entry and wait for the next cross. Checked once per cross, no delayed re-entry. Insufficient MA history passes through. Only gates new long entries; exits and open positions are untouched."
    - title: "Exit (Sell)"
      description: "After minimum hold of 2 days (12 bars), require 2 consecutive bars with close < MA240."
    - title: "Design"
      description: "Exit confirmation filters false breakdowns near the MA without delaying real exits. Combined with a shorter min hold (2D vs 4D), the strategy responds faster while maintaining whipsaw protection throughout the entire position lifetime. The slope gate blocks golden crosses that fire while MA240 is still falling steeply — historically the tail of bear-market rebounds — while the deliberately loose −2% threshold preserves V-shaped cycle-bottom reversals where the MA is still declining but price has already turned."
  data_source_desc: "All data is fetched from OKX public API (no authentication required). Only confirmed/closed candles are used. Signals are generated automatically every 4 hours via GitHub Actions."
