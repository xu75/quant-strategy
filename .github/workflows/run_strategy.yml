name: Run Strategy

on:
  schedule:
    # Every 4 hours at :05 past (UTC: 0, 4, 8, 12, 16, 20)
    # Offset by 5 min to allow OKX candle close confirmation
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas requests pytz matplotlib pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run strategy pipeline
        run: python run_strategy.py

      - name: Validate outputs
        run: |
          python -c "
          import json, sys
          for path in ['data/btc_ma240_4d/latest.json', 'data/btc_ma240_4d/backtest.json']:
              with open(path) as f:
                  data = json.load(f)
              if not data:
                  print(f'FAIL: {path} is empty')
                  sys.exit(1)
              print(f'OK: {path}')
          import os
          for chart in ['data/btc_ma240_4d/charts/equity.png', 'data/btc_ma240_4d/charts/price_ma.png']:
              if not os.path.exists(chart) or os.path.getsize(chart) < 1000:
                  print(f'FAIL: {chart} missing or too small')
                  sys.exit(1)
              print(f'OK: {chart}')
          print('All outputs validated')
          "

      - name: Commit and push results
        run: |
          git config user.name "MeshHub Bot"
          git config user.email "bot@mesh-hub.xyz"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update strategy data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
