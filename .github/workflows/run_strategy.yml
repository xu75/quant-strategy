name: Run Strategy

on:
  schedule:
    # Every 4 hours at :05 past (UTC: 0, 4, 8, 12, 16, 20)
    # Offset by 5 min to allow OKX candle close confirmation
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:  # Manual trigger

permissions:
  contents: write

jobs:
  run-strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas requests pytz matplotlib pytest pyyaml yfinance

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run strategy pipeline
        run: python run_strategy.py

      - name: Validate outputs
        run: |
          python -c "
          import json, sys, os
          for strategy in ['btc_ma_trend', 'btc_ma_trend_plus', 'echotrend_240']:
              for path in [f'data/{strategy}/latest.json', f'data/{strategy}/backtest.json']:
                  if not os.path.exists(path):
                      print(f'FAIL: {path} missing')
                      sys.exit(1)
                  with open(path) as f:
                      data = json.load(f)
                  if not data:
                      print(f'FAIL: {path} is empty')
                      sys.exit(1)
                  print(f'OK: {path}')
              for chart in ['equity.png', 'price_ma.png']:
                  for prefix in [f'data/{strategy}/charts', f'site/public/charts/{strategy}']:
                      p = f'{prefix}/{chart}'
                      if not os.path.exists(p) or os.path.getsize(p) < 1000:
                          print(f'FAIL: {p} missing or too small')
                          sys.exit(1)
                      print(f'OK: {p}')
          print('All outputs validated')
          "

      - name: Commit and push results
        run: |
          git config user.name "Quant Strategy Bot"
          git config user.email "bot@quant-strategy.mesh-hub.xyz"
          git add data/ site/public/charts/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: update strategy data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
