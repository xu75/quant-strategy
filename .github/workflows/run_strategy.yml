name: Run Strategy

on:
  schedule:
    # Every 4 hours at :05 past (UTC: 0, 4, 8, 12, 16, 20)
    # Offset by 5 min to allow OKX candle close confirmation
    - cron: '5 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline mode'
        required: false
        default: 'full-backtest'
        type: choice
        options:
          - full-backtest
          - daily-signal

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas requests pytz yfinance

      - name: Update market data
        run: python run_strategy.py --mode update-data

      - name: Commit market data
        run: |
          git config user.name "Quant Strategy Bot"
          git config user.email "92104817+xu75@users.noreply.github.com"
          git add data/market/
          if git diff --cached --quiet; then
            echo "No new market data"
          else
            git commit -m "chore(data): update market data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

  run-strategy:
    needs: update-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest (includes market data update)
        run: git pull --rebase

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: pip install pandas requests pytz matplotlib pytest pyyaml yfinance

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run strategy pipeline
        run: python run_strategy.py --mode ${{ inputs.mode || 'full-backtest' }}

      - name: Commit and push results
        run: |
          git config user.name "Quant Strategy Bot"
          git config user.email "92104817+xu75@users.noreply.github.com"
          MODE="${{ inputs.mode || 'full-backtest' }}"
          if [ "$MODE" = "daily-signal" ]; then
            find data -name "latest.json" -exec git add {} + 2>/dev/null || true
            find data -name "state.json" -exec git add {} + 2>/dev/null || true
          else
            git add data/ site/public/charts/
          fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore($MODE): update strategy data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi

      - name: Notify Telegram on signal changes
        if: env.TELEGRAM_BOT_TOKEN != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py
