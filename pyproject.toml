[project]
name = "quant-strategy"
version = "0.1.0"
description = "Quant Strategy - Open-source low-frequency quant research lab. All free, all open source."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "requests>=2.28",
    "pytz>=2023.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "akshare==1.18.63",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
